<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>विचार सुविचार</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #00f2fe;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        p {
            font-size: 1.5rem;
            line-height: 1.6;
            font-style: italic;
            min-height: 80px; /* बॉक्स का साइज फिक्स रखने के लिए */
        }
        /* नया बटन स्टाइल */
        .btn {
            background: #00f2fe;
            color: #1e3c72;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
            transition: 0.3s;
            margin-top: 15px;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>विचार सुविचार</h1>
        <p id="quote">"आज की मेहनत, कल का सवेरा लाएगी। बिना रुके आगे बढ़ते रहो!"</p>
        <button class="btn" onclick="changeQuote()">नया विचार</button>
    </div>

    <script>
        // यहाँ हमारी सुविचारों की लिस्ट है
        const quotes = [
            '"आज की मेहनत, कल का सवेरा लाएगी। बिना रुके आगे बढ़ते रहो!"',
            '"जीतने का असली मज़ा तब है, जब सब आपके हारने का इंतज़ार कर रहे हों।"',
            '"सफलता की शुरुआत हमेशा एक छोटे कदम से होती है।"',
            '"जो मुस्कुरा रहा है उसे दर्द ने पाला होगा, जो चल रहा है उसके पाँव में छाला होगा।"',
            '"वक्त आपका है, चाहो तो सोना बना लो या चाहो तो सोने में गुज़ार दो।"'
        ];

        // बटन दबाने पर विचार बदलने वाला जादुई फंक्शन (JavaScript)
        function changeQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            document.getElementById("quote").innerText = quotes[randomIndex];
        }
    </script>

</body>
</html>
