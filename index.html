!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>विचार सुविचार</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 400px;
            width: 90%;
            animation: cardEntry 1s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #00f2fe;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        p {
            font-size: 1.5rem;
            line-height: 1.6;
            font-style: italic;
            min-height: 80px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .fade-effect {
            opacity: 0;
            transform: translateY(-10px);
        }

        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            background: #00f2fe;
            color: #1e3c72;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
            transition: all 0.3s ease;
        }

        .btn-copy {
            background: #4facfe;
            color: white;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        .btn:hover, .btn-copy:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.6);
        }

        .btn:active, .btn-copy:active {
            transform: translateY(1px) scale(0.95);
        }

        @keyframes cardEntry {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(30px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>विचार सुविचार</h1>
        <p id="quote">"आज की मेहनत, कल का सवेरा लाएगी। बिना रुके आगे बढ़ते रहो!"</p>
        
        <div class="btn-container">
            <button class="btn" onclick="changeQuote()">नया विचार</button>
            <button class="btn btn-copy" onclick="copyQuote()" id="copyBtn">कॉपी करें</button>
        </div>
    </div>

    <script>
        const quotes = [
            '"आज की मेहनत, कल का सवेरा लाएगी। बिना रुके आगे बढ़ते रहो!"',
            '"जीतने का असली मज़ा तब है, जब सब आपके हारने का इंतज़ार कर रहे हों।"',
            '"सफलता की शुरुआत हमेशा एक छोटे कदम से होती है।"',
            '"जो मुस्कुरा रहा है उसे दर्द ने पाला होगा, जो चल रहा है उसके पाँव में छाला होगा।"',
            '"वक्त आपका है, चाहो तो सोना बना लो या चाहो तो सोने में गुज़ार दो।"'
        ];

        function changeQuote() {
            const quoteElement = document.getElementById("quote");
            quoteElement.classList.add("fade-effect");
            
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * quotes.length);
                quoteElement.innerText = quotes[randomIndex];
                quoteElement.classList.remove("fade-effect");
                document.getElementById("copyBtn").innerText = "कॉपी करें";
            }, 300);
        }

        function copyQuote() {
            const quoteText = document.getElementById("quote").innerText;
            navigator.clipboard.writeText(quoteText).then(() => {
                const copyBtn = document.getElementById("copyBtn");
                copyBtn.innerText = "✓ कॉपी हो गया!";
            }).catch(err => {
                alert("कॉपी करने में कोई दिक्कत आई!");
            });
        }
    </script>

</body>
</html>
