<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Mind Reader: ओबी53 ग्रैंडमास्टर एडिशन</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --ff-orange: #ff4500;
            --ff-yellow: #ffcc00;
            --card-bg: rgba(26, 26, 36, 0.9);
            --text-color: #ffffff;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: radial-gradient(circle, #1a0f00, #000000);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .game-box {
            background: var(--card-bg);
            border: 2px solid var(--ff-orange);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 0 25px rgba(255, 69, 0, 0.4);
            margin-top: 40px;
        }

        h1 {
            color: var(--ff-yellow);
            text-shadow: 2px 2px #ff4500;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .instruction {
            font-size: 1.2rem;
            color: #e0e0e0;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .item-card {
            background: #24252a;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 12px 5px;
            font-size: 1rem;
            font-weight: bold;
            color: var(--ff-yellow);
            cursor: pointer;
            transition: 0.2s;
        }

        .item-card.selected {
            border-color: var(--ff-yellow);
            background: #ff4500;
            color: white;
            box-shadow: 0 0 10px var(--ff-orange);
        }

        .btn {
            background: linear-gradient(180deg, #ff8c00, #ff4500);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 69, 0, 0.3);
            width: 100%;
            transition: 0.2s;
        }

        .btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px var(--ff-orange);
        }

        .result-box {
            border: 2px dashed var(--ff-yellow);
            padding: 15px;
            border-radius: 10px;
            background: rgba(0,0,0,0.5);
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 20px;
        }

        .result-emoji {
            font-size: 4.5rem;
            animation: glow 1s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #ffcc00; }
            to { text-shadow: 0 0 20px #ff4500; }
        }
    </style>
</head>
<body>

    <div class="game-box" id="gameBox">
        <h1>FF MIND READER 🧠💥</h1>
        <p style="color: #ff4500; font-weight: bold; letter-spacing: 2px;">OB53 GRANDMASTER EDITION</p>
        <hr style="border: 1px solid var(--ff-orange); margin-bottom: 20px;">
        
        <div id="content">
            <!-- Step 1 -->
            <p class="instruction">नीचे दिए गए कड़क आइटम्स में से कोई भी <b>एक आइटम</b> अपने मन में चुन लो भाई और उसपर क्लिक करो!</p>
            <div class="items-grid">
                <div class="item-card" onclick="selectItem(this, '🔴 Red Criminal')">🔴 Criminal</div>
                <div class="item-card" onclick="selectItem(this, '⚡ Cobra MP40')">⚡ Cobra MP40</div>
                <div class="item-card" onclick="selectItem(this, '👑 Bunny Bundle')">👑 Bunny</div>
                <div class="item-card" onclick="selectItem(this, '🧊 Angelic Pant')">🧊 Angelic</div>
                <div class="item-card" onclick="selectItem(this, '🔥 Draco AK')">🔥 Draco AK</div>
                <div class="item-card" onclick="selectItem(this, '💎 Hip Hop Bundle')">💎 Hip Hop</div>
            </div>
            <button class="btn" onclick="startHack()">हाँ भाई, सिलेक्ट कर लिया! ➔</button>
        </div>
    </div>

    <script>
        let chosenItem = "";

        function selectItem(element, name) {
            // Remove selection from all cards
            const cards = document.querySelectorAll('.item-card');
            cards.forEach(card => card.classList.remove('selected'));
            
            // Add selection to clicked card
            element.classList.add('selected');
            chosenItem = name;
        }

        function startHack() {
            if (!chosenItem) {
                alert("पहले कोई एक आइटम सिलेक्ट तो करो नितिन भाई! 😉");
                return;
            }

            const content = document.getElementById('content');
            content.innerHTML = `
                <p class="instruction" style="color: #ffcc00; font-weight: bold;">माइंड वेव्स स्कैन की जा रही हैं... 📡</p>
                <p class="instruction" style="color: #ff4500;">आपके रेडमी 8 फोन से सिग्नल्स मैच हो रहे हैं... 📱</p>
                <div class="instruction" style="font-size: 1rem; color: #888;">डेटा पैकेट्स डिक्रिप्ट हो रहे हैं... 50%</div>
            `;
            
            setTimeout(() => {
                content.innerHTML = `
                    <p class="instruction" style="color: #ffcc00; font-weight: bold;">हैकिंग ऑलमोस्ट कम्प्लीट! 💻</p>
                    <p class="instruction">दिमाग की कोडिंग डिकोड हो चुकी है। परिणाम देखने के लिए नीचे बटन दबाएं!</p>
                    <button class="btn" onclick="showFinalResult()">नतीजा देखो भाई! ⚡</button>
                `;
            }, 2000);
        }

        function showFinalResult() {
            const content = document.getElementById('content');
            content.innerHTML = `
                <p class="instruction" style="color: #ffcc00; font-weight: bold;">फ्री फायर सर्वर कनेक्टेड... 🎮</p>
                <div class="instruction">लोडिंग रिजल्ट...</div>
            `;
            
            setTimeout(() => {
                content.innerHTML = `
                    <div class="result-emoji">👑</div>
                    <h2 style="color: var(--ff-yellow); margin-top: 10px;">BOOYAH! 🎉</h2>
                    <p class="instruction">नितिन भाई का जादू! आपके दोस्त ने मन में यही चुना था:</p>
                    <div class="result-box">🔥 ${chosenItem} 🔥</div>
                    <p class="instruction" style="font-size: 1rem; color: #aaa;">है ना एकदम ग्रैंडमास्टर लेवल कोडिंग? 😉</p>
                    <button class="btn" onclick="location.reload()">दोबारा खेलें 🔄</button>
                `;
            }, 1500);
        }
    </script>

</body>
</html>
